[project]
name = "sql-query-optimizer-env"
version = "1.0.0"
description = "OpenEnv SQL Query Optimization Environment"
authors = [{ name = "Shivani" }]
requires-python = ">=3.11"
dependencies = [
    "fastapi==0.111.0",
    "uvicorn[standard]==0.29.0",
    "pydantic==2.7.1",
    "openai==1.30.1",
    "requests==2.32.2",
    "openenv-core>=0.2.0",
]

# openenv validate looks for [project.scripts].server ending in :main
[project.scripts]
server = "server.app:main"

[tool.openenv]
entry_point = "server.app:app"